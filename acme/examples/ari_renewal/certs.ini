[policy]
# Local safety limits. The server can never push a renewal past
# notAfter - renew_before_expiry_days.
renew_before_expiry_days = 30
alert_lead_days = 7
max_ari_failures = 3
default_retry_after_hours = 6
max_retry_after_hours = 24

[cert:alpha]
path = certs/alpha.pem

[cert:beta]
path = certs/beta.pem

[cert:gamma]
path = certs/gamma.pem

[cert:delta]
path = certs/delta.pem

[cert:epsilon]
path = certs/epsilon.pem
